name: webmaster
# Publish health telemetry

on:
  schedule:
    - cron: "30 7 * * *"   # daily, UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "Fleet webmaster"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run webmaster
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.FLEET_REPOS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash agents/webmaster.sh

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmaster-log
          path: ~/.fleetweek/logs/
          if-no-files-found: ignore
