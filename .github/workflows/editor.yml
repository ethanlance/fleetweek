name: editor
# Review and merge the digest

on:
  schedule:
    - cron: "5 7 * * *"   # daily, UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "Fleet editor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run editor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.FLEET_REPOS_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash agents/editor.sh

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-log
          path: ~/.fleetweek/logs/
          if-no-files-found: ignore
